[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "use-case-icp"
version = "0.1.0"
description = "Local-first Codex and Etiq workflow for use-case and ICP research"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.26"]

[project.optional-dependencies]
dev = ["pytest>=8"]
etiq = ["etiq-copilot==2.3.0"]

[project.scripts]
use-case-icp = "use_case_icp.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["outputs", ".tools", ".venv"]
