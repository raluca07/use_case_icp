<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1900" viewBox="0 0 1500 1900" role="img" aria-labelledby="title description">
  <title id="title">Demand–coverage control loop: implemented workflow and planned extensions</title>
  <desc id="description">Solid lines show the current executable workflow. Amber dashed lines show partial behavior. Grey dashed lines show planned evidence fingerprinting, saturation, gap-directed replanning, and trusted-frontier resume.</desc>
  <defs>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#172033}
      .subtitle{font:20px Arial,sans-serif;fill:#536079}
      .lane{font:700 21px Arial,sans-serif;letter-spacing:1px}
      .label{font:22px Arial,sans-serif;fill:#202838;text-anchor:middle}
      .small{font:18px Arial,sans-serif;fill:#3e4b62;text-anchor:middle}
      .edge-label{font:18px Arial,sans-serif;fill:#344158}
      .caption{font:700 21px Arial,sans-serif;fill:#26334a}
      .implemented{fill:#eef5ff;stroke:#3478c9;stroke-width:3}
      .review{fill:#f4f6f9;stroke:#71809a;stroke-width:3}
      .decision{fill:#fff7df;stroke:#bb7000;stroke-width:3}
      .success{fill:#eaf8ef;stroke:#26905a;stroke-width:3}
      .repair{fill:#fff0f0;stroke:#d84a4a;stroke-width:3}
      .partial{fill:#fff8e8;stroke:#c48919;stroke-width:3;stroke-dasharray:11 8}
      .planned{fill:#f5f6f8;stroke:#7d8799;stroke-width:3;stroke-dasharray:11 8}
      .arrow{fill:none;stroke:#3478c9;stroke-width:4;marker-end:url(#arrow-blue)}
      .arrow-grey{fill:none;stroke:#6e7b91;stroke-width:3.5;marker-end:url(#arrow-grey)}
      .arrow-red{fill:none;stroke:#d84a4a;stroke-width:3.5;marker-end:url(#arrow-red)}
      .arrow-partial{fill:none;stroke:#c48919;stroke-width:3.5;stroke-dasharray:11 8;marker-end:url(#arrow-amber)}
      .arrow-planned{fill:none;stroke:#7d8799;stroke-width:3.5;stroke-dasharray:11 8;marker-end:url(#arrow-grey)}
    </style>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 z" fill="#3478c9"/></marker>
    <marker id="arrow-grey" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 z" fill="#6e7b91"/></marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 z" fill="#d84a4a"/></marker>
    <marker id="arrow-amber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 z" fill="#c48919"/></marker>
  </defs>

  <rect width="1500" height="1900" fill="#ffffff"/>
  <text x="750" y="58" class="title" text-anchor="middle">Demand–coverage control loop</text>
  <text x="750" y="94" class="subtitle" text-anchor="middle">Current executable workflow and explicitly separated planned extensions</text>

  <rect x="45" y="125" width="920" height="1695" rx="24" fill="#fbfdff" stroke="#d6dfec" stroke-width="2"/>
  <rect x="995" y="125" width="460" height="1695" rx="24" fill="#fafafa" stroke="#cfd4dd" stroke-width="2" stroke-dasharray="12 9"/>
  <text x="505" y="170" class="lane" fill="#2871c5" text-anchor="middle">CURRENT EXECUTABLE WORKFLOW</text>
  <text x="1225" y="170" class="lane" fill="#69758a" text-anchor="middle">PLANNED EXTENSIONS</text>

  <!-- Current workflow -->
  <rect x="315" y="205" width="380" height="82" rx="16" class="implemented"/>
  <text x="505" y="241" class="label"><tspan x="505">Plan a bounded list</tspan><tspan x="505" dy="27">of segments</tspan></text>

  <path d="M505 287 L505 330" class="arrow-grey"/>
  <rect x="255" y="330" width="500" height="92" rx="16" class="implemented"/>
  <text x="505" y="368" class="label"><tspan x="505" font-weight="700">DEMAND GENERATION</tspan><tspan x="505" dy="29">author and execute the demand pipeline</tspan></text>

  <path d="M505 422 L505 465" class="arrow-grey"/>
  <rect x="255" y="465" width="500" height="92" rx="16" class="review"/>
  <text x="505" y="502" class="label"><tspan x="505">Etiq capture and review</tspan><tspan x="505" dy="29">validate the review receipt</tspan></text>

  <path d="M505 557 L505 594" class="arrow-grey"/>
  <polygon points="505,594 730,660 505,726 280,660" class="decision"/>
  <text x="505" y="653" class="label"><tspan x="505">Is every required demand unit</tspan><tspan x="505" dy="28">trusted for reuse?</tspan></text>

  <!-- Demand repair loop -->
  <path d="M280 660 L188 660 L188 735" class="arrow-red"/>
  <text x="220" y="642" class="edge-label">No</text>
  <rect x="60" y="735" width="300" height="90" rx="16" class="review"/>
  <text x="210" y="772" class="label"><tspan x="210">Retrace to the earliest</tspan><tspan x="210" dy="28">graph-causal boundary</tspan></text>
  <path d="M210 825 L210 860" class="arrow-red"/>
  <rect x="60" y="860" width="300" height="92" rx="16" class="repair"/>
  <text x="210" y="897" class="label"><tspan x="210">Repair selected source scope</tspan><tspan x="210" dy="28">boundary or faulty node</tspan></text>
  <path d="M210 952 L210 987" class="arrow-red"/>
  <rect x="60" y="987" width="300" height="90" rx="16" class="repair"/>
  <text x="210" y="1025" class="label"><tspan x="210">Rerun the complete</tspan><tspan x="210" dy="28">demand stage</tspan></text>
  <path d="M60 1032 L28 1032 L28 376 L255 376" class="arrow-red"/>

  <!-- Coverage path -->
  <path d="M505 726 L505 775" class="arrow-grey"/>
  <text x="526" y="759" class="edge-label">Yes</text>
  <rect x="430" y="775" width="500" height="92" rx="16" class="implemented"/>
  <text x="680" y="813" class="label"><tspan x="680" font-weight="700">COVERAGE MAPPING</tspan><tspan x="680" dy="29">map trusted demand to capabilities</tspan></text>

  <path d="M680 867 L680 910" class="arrow-grey"/>
  <rect x="430" y="910" width="500" height="92" rx="16" class="review"/>
  <text x="680" y="947" class="label"><tspan x="680">Etiq capture and review</tspan><tspan x="680" dy="29">validate the review receipt</tspan></text>

  <path d="M680 1002 L680 1039" class="arrow-grey"/>
  <polygon points="680,1039 900,1103 680,1167 460,1103" class="decision"/>
  <text x="680" y="1096" class="label"><tspan x="680">Is every required coverage unit</tspan><tspan x="680" dy="28">trusted for reuse?</tspan></text>

  <!-- Coverage repair loop -->
  <path d="M460 1103 L380 1103 L380 1159 L360 1159" class="arrow-red"/>
  <text x="402" y="1085" class="edge-label">No</text>
  <rect x="60" y="1118" width="300" height="82" rx="16" class="review"/>
  <text x="210" y="1152" class="label"><tspan x="210">Retrace causal boundary</tspan><tspan x="210" dy="27">and select repair scope</tspan></text>
  <path d="M210 1200 L210 1235" class="arrow-red"/>
  <rect x="60" y="1235" width="300" height="82" rx="16" class="repair"/>
  <text x="210" y="1270" class="label"><tspan x="210">Repair and rerun the</tspan><tspan x="210" dy="27">complete coverage stage</tspan></text>
  <path d="M60 1276 L28 1276 L28 821 L430 821" class="arrow-red"/>

  <path d="M680 1167 L680 1210" class="arrow-grey"/>
  <text x="701" y="1195" class="edge-label">Yes</text>
  <polygon points="680,1210 885,1268 680,1326 475,1268" class="decision"/>
  <text x="680" y="1276" class="label">Is coverage sufficient?</text>

  <path d="M885 1268 L916 1268 L916 1350" class="arrow"/>
  <text x="900" y="1249" class="edge-label">Yes</text>
  <rect x="800" y="1350" width="150" height="96" rx="16" class="success"/>
  <text x="875" y="1388" class="label"><tspan x="875">Final</tspan><tspan x="875" dy="28">synthesis</tspan></text>

  <path d="M680 1326 L680 1365" class="arrow-grey"/>
  <text x="701" y="1354" class="edge-label">No</text>
  <rect x="400" y="1365" width="380" height="92" rx="16" class="implemented"/>
  <text x="590" y="1402" class="label"><tspan x="590">Retain coverage gaps</tspan><tspan x="590" dy="29">and processed evidence</tspan></text>

  <path d="M590 1457 L590 1494" class="arrow-grey"/>
  <polygon points="590,1494 800,1552 590,1610 380,1552" class="decision"/>
  <text x="590" y="1545" class="label"><tspan x="590">Are there more</tspan><tspan x="590" dy="28">preplanned segments?</tspan></text>

  <path d="M380 1552 L245 1552 L245 1650" class="arrow-partial"/>
  <text x="312" y="1533" class="edge-label">Yes</text>
  <rect x="75" y="1650" width="410" height="102" rx="16" class="partial"/>
  <text x="280" y="1684" class="label"><tspan x="280">Run the next preplanned segment</tspan><tspan x="280" dy="27">with retained gaps as context</tspan><tspan x="280" dy="25" class="small">implemented hand-off; not dynamic replanning</tspan></text>
  <path d="M75 1701 L28 1701 L28 376 L255 376" class="arrow-partial"/>

  <path d="M590 1610 L590 1650" class="arrow-grey"/>
  <text x="611" y="1637" class="edge-label">No</text>
  <rect x="520" y="1650" width="410" height="102" rx="16" class="success"/>
  <text x="725" y="1688" class="label"><tspan x="725">Final synthesis</tspan><tspan x="725" dy="28">report remaining gaps</tspan></text>

  <!-- Planned extension lane -->
  <path d="M590 1457 L590 1476 L980 1476 L980 290 L1060 290" class="arrow-planned"/>
  <text x="1218" y="226" class="small">Triggered by trusted but insufficient coverage</text>
  <rect x="1060" y="250" width="330" height="100" rx="16" class="planned"/>
  <text x="1225" y="286" class="label"><tspan x="1225">Compare demand-evidence</tspan><tspan x="1225" dy="28">fingerprints across iterations</tspan></text>

  <path d="M1225 350 L1225 402" class="arrow-planned"/>
  <polygon points="1225,402 1390,460 1225,518 1060,460" class="planned"/>
  <text x="1225" y="453" class="label"><tspan x="1225">Has evidence</tspan><tspan x="1225" dy="28">saturated?</tspan></text>

  <path d="M1060 460 L1025 460 L1025 600 L1060 600" class="arrow-planned"/>
  <text x="1026" y="441" class="edge-label">No</text>
  <rect x="1060" y="555" width="330" height="100" rx="16" class="planned"/>
  <text x="1225" y="591" class="label"><tspan x="1225">Plan a new demand run from</tspan><tspan x="1225" dy="28">uncovered needs and source gaps</tspan></text>

  <path d="M1225 655 L1225 710" class="arrow-planned"/>
  <rect x="1060" y="710" width="330" height="116" rx="16" class="planned"/>
  <text x="1225" y="748" class="label"><tspan x="1225">Resume from trusted frontier</tspan><tspan x="1225" dy="28">or execute only the affected branch</tspan><tspan x="1225" dy="25" class="small">not a complete stage rerun</tspan></text>

  <path d="M1060 768 L1008 768 L1008 376 L755 376" class="arrow-planned"/>

  <path d="M1390 460 L1420 460 L1420 920 L1390 920" class="arrow-planned"/>
  <text x="1403" y="441" class="edge-label">Yes</text>
  <rect x="1060" y="870" width="330" height="108" rx="16" class="planned"/>
  <text x="1225" y="906" class="label"><tspan x="1225">Recover previous attempts,</tspan><tspan x="1225" dy="28">limits, and stopping evidence</tspan></text>

  <path d="M1225 978 L1225 1035" class="arrow-planned"/>
  <rect x="1060" y="1035" width="330" height="100" rx="16" class="planned"/>
  <text x="1225" y="1072" class="label"><tspan x="1225">Stop and report saturation</tspan><tspan x="1225" dy="28">and remaining coverage gaps</tspan></text>

  <text x="1035" y="1235" class="caption">Important implementation detail</text>
  <text x="1225" y="1280" class="small"><tspan x="1225">The trusted frontier is computed</tspan><tspan x="1225" dy="27">and stored today, but it does not yet</tspan><tspan x="1225" dy="27">control execution resume.</tspan></text>
  <text x="1225" y="1395" class="small"><tspan x="1225">Source changes can be scoped to a</tspan><tspan x="1225" dy="27">boundary or faulty node, but replay</tspan><tspan x="1225" dy="27">still executes the complete stage.</tspan></text>

  <!-- Legend -->
  <line x1="1025" y1="1580" x2="1100" y2="1580" class="arrow"/>
  <text x="1120" y="1587" class="edge-label">Implemented</text>
  <line x1="1025" y1="1640" x2="1100" y2="1640" class="arrow-partial"/>
  <text x="1120" y="1647" class="edge-label">Partial hand-off</text>
  <line x1="1025" y1="1700" x2="1100" y2="1700" class="arrow-planned"/>
  <text x="1120" y="1707" class="edge-label">Planned</text>

  <text x="750" y="1860" class="caption" text-anchor="middle">Solid paths describe the repository today. Dashed paths are not claimed as completed behavior.</text>
</svg>
